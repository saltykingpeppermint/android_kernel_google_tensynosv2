name: Verify Kernel Configs

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check KernelSU Next config
        run: |
          echo "=== KernelSU Next Kconfig ==="
          grep -A5 "config KSU" kernelsu-next/Kconfig

      - name: Check zuma Kconfig additions
        run: |
          echo "=== zuma Kconfig.ext.zuma additions ==="
          grep -A3 "BLUETOOTH_POWERSAVE_EXCLUDE" google-devices/zuma/Kconfig.ext.zuma
          grep -A3 "WIFI_POWERSAVE_EXCLUDE" google-devices/zuma/Kconfig.ext.zuma

      - name: Check bluetooth nitrous.c modifications
        run: |
          echo "=== Bluetooth power save exclusion ==="
          grep -B2 -A5 "BLUETOOTH_POWERSAVE_EXCLUDE" google-modules/bluetooth/broadcom/nitrous.c

      - name: Check WiFi Kbuild modifications
        run: |
          echo "=== WiFi power save exclusion ==="
          grep -B2 -A5 "WIFI_POWERSAVE_EXCLUDE" google-modules/wlan/bcm4389/Kbuild

      - name: Check restart retry
        run: |
          set -e
          echo "=== Restart retry mechanism ==="
          # The retry lives in kernel_restart() in kernel/reboot.c, NOT in the
          # Exynos reset driver. pixel-zuma-reboot.c is deliberately left as the
          # unmodified upstream stub: putting the retry inside the driver only
          # covers that one entry point, and a second loop there would fight the
          # one in kernel_restart().
          grep -n -B2 -A5 "MAX_RESTART_RETRIES" kernel/reboot.c
          grep -n "RESTART_RETRY_DELAY_MS" kernel/reboot.c
          if grep -q "MAX_RESTART_RETRIES" google-modules/power/reset/pixel-zuma-reboot.c; then
            echo "::error::pixel-zuma-reboot.c re-implements the restart retry; it must stay the upstream stub"
            exit 1
          fi
          echo "OK: retry loop is in kernel/reboot.c and only there"

      - name: Check build config
        run: |
          echo "=== build.config.common ==="
          grep -E "CONFIG_KSU|CONFIG_BLUETOOTH_POWERSAVE|CONFIG_WIFI_POWERSAVE" build.config.common

      - name: Summary
        run: |
          echo "✅ All kernel modifications verified!"
          echo "📦 KernelSU Next: $(grep -c "config KSU" kernelsu-next/Kconfig) configs found"
          echo "🔋 Power save exclusions: Added"
          echo "🔄 Restart retries: $(grep -oE 'MAX_RESTART_RETRIES[[:space:]]+[0-9]+' kernel/reboot.c | grep -oE '[0-9]+$') attempts implemented (kernel/reboot.c)"