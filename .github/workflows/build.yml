name: Build Tensor G3 Kernel (zuma)

on:
  push:
    branches: [main, master, 16.0.0-sultan]
    tags: ['v*']
  pull_request:
    branches: [main, master, 16.0.0-sultan]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

env:
  KERNEL_SRC_DIR: ${{ github.workspace }}/kernel_source
  DIST_DIR: ${{ github.workspace }}/dist
  OUR_REPO_DIR: ${{ github.workspace }}/our_modifications
  # KernelSU Next requires CONFIG_KPROBES, and arch/Kconfig declares KPROBES
  # with `depends on MODULES`. This kernel's zuma_defconfig sets
  # CONFIG_INTEGRATE_MODULES=y, which forces MODULES=n (kernel/module/Kconfig),
  # so CONFIG_KSU is pruned by olddefconfig. Until that is resolved, KernelSU
  # is disabled so the workflow ships a kernel that is guaranteed to boot.
  # Flip this to 'true' once the KPROBES/MODULES conflict is resolved.
  ENABLE_KSU: false

jobs:
  build:
    name: Build Kernel (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]

    steps:
      - name: Setup Node.js 20 (for actions/checkout@v4)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout our modifications
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          path: ${{ env.OUR_REPO_DIR }}

      - name: Clone full kernel source
        run: |
          git clone --depth=1 -b 16.0.0-sultan \
            https://github.com/kerneltoast/android_kernel_google_tensynos.git \
            ${{ env.KERNEL_SRC_DIR }}

      - name: Checkout KernelSU Next
        if: env.ENABLE_KSU == 'true'
        uses: actions/checkout@v4.2.2
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: dev
          path: ${{ env.KERNEL_SRC_DIR }}/kernelsu-next
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex \
            git libelf-dev libncurses5-dev libssl-dev python3-full python3-dev \
            unzip wget zip zlib1g-dev lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install LLVM/Clang
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          sudo mv clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04 /opt/llvm
          echo "/opt/llvm/bin" >> $GITHUB_PATH
          /opt/llvm/bin/clang --version

      - name: Build kernel (in-tree, O= empty)
        # The build script lives in .github/scripts/build.sh rather than inline
        # here. GitHub rejects any single `run:` value longer than 21000
        # characters ("Exceeded max expression length 21000"); this block had
        # grown to 25288, which invalidated the entire workflow file and
        # produced runs with zero jobs instead of a compile error. A separate
        # file also makes the script runnable and bash -n-checkable locally,
        # and puts the AK3 heredoc at column 0 with no block-indent games.
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: bash "${OUR_REPO_DIR}/.github/scripts/build.sh"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.build_type }}
          path: |
            ${{ env.DIST_DIR }}/*
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.DIST_DIR }}/*.zip
            ${{ env.DIST_DIR }}/Image-*
            ${{ env.DIST_DIR }}/config-*
            ${{ env.DIST_DIR }}/vmlinux-*
          generate_release_notes: true
          draft: false
          prerelease: false
