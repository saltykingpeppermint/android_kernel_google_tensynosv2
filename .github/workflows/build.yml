name: Build Tensor G3 Kernel with KernelSU Next

on:
  push:
    branches: [main, master, 16.0.0-sultan]
    tags: ['v*']
  pull_request:
    branches: [main, master, 16.0.0-sultan]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

env:
  KERNEL_SRC_DIR: ${{ github.workspace }}/kernel_source
  BUILD_DIR: ${{ github.workspace }}/out
  DIST_DIR: ${{ github.workspace }}/dist
  OUR_REPO_DIR: ${{ github.workspace }}/our_modifications

jobs:
  build:
    name: Build Kernel (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]

    steps:
      - name: Setup Node.js 20 (for actions/checkout@v4)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout our modifications
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          path: ${{ env.OUR_REPO_DIR }}

      - name: Clone full kernel source
        run: |
          git clone --depth=1 -b 16.0.0-sultan \
            https://github.com/kerneltoast/android_kernel_google_tensynos.git \
            ${{ env.KERNEL_SRC_DIR }}

      - name: Checkout KernelSU Next
        uses: actions/checkout@v4.2.2
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: dev
          path: ${{ env.KERNEL_SRC_DIR }}/kernelsu-next
          submodules: true

      - name: Apply modifications
        run: |
          cd ${{ env.KERNEL_SRC_DIR }}
          
          # Debug: show Kconfig structure around line 25
          echo "=== Kconfig lines 20-30 ==="
          sed -n '20,30p' Kconfig
          
          # Add KernelSU Next to Kconfig - try multiple patterns
          if ! grep -q "kernelsu-next/Kconfig" Kconfig; then
            # Try security/Kconfig
            if grep -q 'source "security/Kconfig"' Kconfig; then
              sed -i '/source "security\/Kconfig"/a source "kernelsu-next\/Kconfig"' Kconfig
              echo "Added after security/Kconfig"
            # Try crypto/Kconfig
            elif grep -q 'source "crypto/Kconfig"' Kconfig; then
              sed -i '/source "crypto\/Kconfig"/i source "kernelsu-next\/Kconfig"' Kconfig
              echo "Added before crypto/Kconfig"
            # Try lib/Kconfig
            elif grep -q 'source "lib/Kconfig"' Kconfig; then
              sed -i '/source "lib\/Kconfig"/i source "kernelsu-next\/Kconfig"' Kconfig
              echo "Added before lib/Kconfig"
            # Last resort: append after Documentation/Kconfig
            elif grep -q 'source "Documentation/Kconfig"' Kconfig; then
              sed -i '/source "Documentation\/Kconfig"/a source "kernelsu-next\/Kconfig"' Kconfig
              echo "Added after Documentation/Kconfig"
            else
              # Ultimate fallback: append at end before choice block
              sed -i '/choice/i source "kernelsu-next\/Kconfig"' Kconfig
              echo "Added before choice block"
            fi
          fi
          
          # Verify it was added
          echo "=== Kconfig after modification (lines 20-35) ==="
          sed -n '20,35p' Kconfig
          
          # Add power save configs to zuma Kconfig
          if ! grep -q "BLUETOOTH_POWERSAVE_EXCLUDE" google-devices/zuma/Kconfig.ext.zuma; then
            printf '\n# KernelSU Next\nsource "$(srctree)/kernelsu-next/Kconfig"\n\nconfig BLUETOOTH_POWERSAVE_EXCLUDE\n  bool "Exclude Bluetooth from power saving"\n  default y\n  help\n    Exclude Bluetooth from power saving to work around hardware issues.\n\nconfig WIFI_POWERSAVE_EXCLUDE\n  bool "Exclude WiFi from power saving"\n  default y\n  help\n    Exclude WiFi from power saving to work around hardware issues.\n' >> google-devices/zuma/Kconfig.ext.zuma
          fi
          
          # Copy modified files
          cp "${{ env.OUR_REPO_DIR }}/google-modules/bluetooth/broadcom/nitrous.c" \
             google-modules/bluetooth/broadcom/nitrous.c
          cp "${{ env.OUR_REPO_DIR }}/google-modules/wlan/bcm4389/Kbuild" \
             google-modules/wlan/bcm4389/Kbuild
          cp "${{ env.OUR_REPO_DIR }}/google-modules/power/reset/pixel-zuma-reboot.c" \
             google-modules/power/reset/pixel-zuma-reboot.c
          
          # Add build configs
          if ! grep -q "CONFIG_KSU=y" build.config.common; then
            printf '\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_EXT4_FS=y\nCONFIG_BLUETOOTH_POWERSAVE_EXCLUDE=y\nCONFIG_WIFI_POWERSAVE_EXCLUDE=y\n' >> build.config.common
          fi

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git libelf-dev libncurses5-dev libssl-dev python3-full python3-dev unzip wget zip zlib1g-dev

      - name: Install LLVM/Clang
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          sudo mv clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04 /opt/llvm
          echo "/opt/llvm/bin" >> $GITHUB_PATH
          clang --version

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Copy build config constants
        run: |
          cp ${{ env.OUR_REPO_DIR }}/build.config.constants ${{ env.KERNEL_SRC_DIR }}/build.config.constants

      - name: Configure kernel
        run: |
          cd ${{ env.KERNEL_SRC_DIR }}
          export ROOT_DIR=${{ env.OUR_REPO_DIR }}
          export KERNEL_DIR=.
          source build.config.common
          source google-devices/zuma/build.config.zuma
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          make O=${{ env.BUILD_DIR }} zuma_defconfig
          ./scripts/config --file ${{ env.BUILD_DIR }}/.config \
            --enable KSU --enable KPROBES --enable EXT4_FS \
            --enable BLUETOOTH_POWERSAVE_EXCLUDE --enable WIFI_POWERSAVE_EXCLUDE \
            --enable DEBUG_REBOOT --set-str LOCALVERSION "-kernelsu-next"
          make O=${{ env.BUILD_DIR }} olddefconfig

      - name: Build kernel
        run: |
          cd ${{ env.KERNEL_SRC_DIR }}
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          make O=${{ env.BUILD_DIR }} -j$(nproc) LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

      - name: Build DTBs
        run: |
          cd ${{ env.KERNEL_SRC_DIR }}
          export ARCH=arm64
          export CROSS_COMPLIER=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          make O=${{ env.BUILD_DIR }} -j$(nproc) dtbs

      - name: Build modules
        run: |
          cd ${{ env.KERNEL_SRC_DIR }}
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          make O=${{ env.BUILD_DIR }} -j$(nproc) modules
          make O=${{ env.BUILD_DIR }} INSTALL_MOD_PATH=${{ env.BUILD_DIR }}/modules modules_install
          find ${{ env.BUILD_DIR }}/modules -name "*.ko" -exec aarch64-linux-gnu-strip --strip-unneeded {} \; 2>/dev/null || true

      - name: Create AnyKernel3 flashable zip
        run: |
          cd ${{ env.KERNEL_SRC_DIR }}
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          rm -f anykernel3/Image anykernel3/dtb
          rm -rf anykernel3/modules
          cp ${{ env.BUILD_DIR }}/arch/arm64/boot/Image anykernel3/
          mkdir -p anykernel3/dtb
          cp ${{ env.BUILD_DIR }}/arch/arm64/boot/dts/google/*.dtb anykernel3/dtb/ 2>/dev/null || true
          mkdir -p anykernel3/modules
          cp -r ${{ env.BUILD_DIR }}/modules/lib/modules/* anykernel3/modules/ 2>/dev/null || true
          # Write anykernel.sh using printf to avoid heredoc issues
          printf 'properties() {\n  kernel.string=Tensor G3 KernelSU Next\n  do.devicecheck=1\n  do.modules=1\n  do.cleanup=1\n  do.cleanuponabort=1\n  device.name1=zuma\n  device.name2=shusky\n  device.name3=husky\n  device.name4=akita\n  device.name5=tokay\n  supported.versions=14\n}\n. tools/ak3-core.sh\ndump_boot\nwrite_boot\nif [ "$do.modules" == 1 ]; then\n  for module in modules/*; do\n    if [ -f "$module" ]; then\n      ui_print "Installing $(basename $module)..."\n      cp -f "$module" "$ramdisk/lib/modules/"\n    fi\n  done\nfi\n' > anykernel3/anykernel.sh
          cd anykernel3
          zip -r9 ${{ env.DIST_DIR }}/KernelSU-Next-zuma-${{ matrix.build_type }}-${{ github.run_number }}.zip . -x ".git*" -x "README.md" -x "*.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.build_type }}
          path: |
            ${{ env.DIST_DIR }}/*
            ${{ env.BUILD_DIR }}/arch/arm64/boot/Image
            ${{ env.BUILD_DIR }}/.config
            ${{ env.BUILD_DIR }}/vmlinux
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.DIST_DIR }}/*.zip
            ${{ env.DIST_DIR }}/Image
            ${{ env.DIST_DIR }}/config
            ${{ env.BUILD_DIR }}/vmlinux
          generate_release_notes: true
          draft: false
          prerelease: false