name: Build Tensor G3 Kernel (zuma)

on:
  push:
    branches: [main, master, 16.0.0-sultan]
    tags: ['v*']
  pull_request:
    branches: [main, master, 16.0.0-sultan]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

env:
  KERNEL_SRC_DIR: ${{ github.workspace }}/kernel_source
  DIST_DIR: ${{ github.workspace }}/dist
  OUR_REPO_DIR: ${{ github.workspace }}/our_modifications
  # KernelSU Next requires CONFIG_KPROBES, and arch/Kconfig declares KPROBES
  # with `depends on MODULES`. This kernel's zuma_defconfig sets
  # CONFIG_INTEGRATE_MODULES=y, which forces MODULES=n (kernel/module/Kconfig),
  # so CONFIG_KSU is pruned by olddefconfig. Until that is resolved, KernelSU
  # is disabled so the workflow ships a kernel that is guaranteed to boot.
  # Flip this to 'true' once the KPROBES/MODULES conflict is resolved.
  ENABLE_KSU: false

jobs:
  build:
    name: Build Kernel (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Required by the release step below. On a v* tag push this job
    # creates a GitHub Release and attaches the flashable zip, using the
    # workflow's GITHUB_TOKEN -- but that token is read-only by default
    # on repositories created after 2023 unless permissions are granted
    # explicitly. Without this block every build step succeeds and the
    # release step then fails with a 403 on the releases API.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]

    steps:
      - name: Setup Node.js 20 (for actions/checkout@v4)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout our modifications
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          path: ${{ env.OUR_REPO_DIR }}

      - name: Clone full kernel source
        run: |
          git clone --depth=1 -b 16.0.0-sultan \
            https://github.com/kerneltoast/android_kernel_google_tensynos.git \
            ${{ env.KERNEL_SRC_DIR }}

      - name: Checkout KernelSU Next
        if: env.ENABLE_KSU == 'true'
        uses: actions/checkout@v4.2.2
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: dev
          path: ${{ env.KERNEL_SRC_DIR }}/kernelsu-next
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex \
            git libelf-dev libncurses5-dev libssl-dev python3-full python3-dev \
            unzip wget zip zlib1g-dev lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install LLVM/Clang
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          sudo mv clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04 /opt/llvm
          echo "/opt/llvm/bin" >> $GITHUB_PATH
          /opt/llvm/bin/clang --version

      - name: Build kernel (in-tree, O= empty)
        # The build script lives in .github/scripts/build.sh rather than inline
        # here. GitHub rejects any single `run:` value longer than 21000
        # characters ("Exceeded max expression length 21000"); this block had
        # grown to 25288, which invalidated the entire workflow file and
        # produced runs with zero jobs instead of a compile error. A separate
        # file also makes the script runnable and bash -n-checkable locally,
        # and puts the AK3 heredoc at column 0 with no block-indent games.
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: bash "${OUR_REPO_DIR}/.github/scripts/build.sh"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.build_type }}
          path: |
            ${{ env.DIST_DIR }}/*
          retention-days: 30

      # Runs on a tag push only, and deliberately on ONE matrix leg.
      # Both legs build in parallel and would otherwise race to create
      # the same release: the loser gets a 422 "already exists" and the
      # run ends red even though the build was fine. Restricting it to
      # the release leg makes that impossible and keeps the asset names
      # stable. The debug build remains available as a workflow
      # artifact.
      #
      # assets are limited to what a person can actually use. vmlinux is
      # excluded on purpose: built with CONFIG_DEBUG_INFO_DWARF4 its
      # symbols run to a multi-gigabyte file, and GitHub caps a single
      # release asset at 2 GiB -- one oversized file fails the step
      # after the zip is already attached, leaving a half-populated
      # release. It stays downloadable from the workflow artifact for
      # 30 days.
      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') && matrix.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DIST_DIR }}/*.zip
            ${{ env.DIST_DIR }}/Image-*
            ${{ env.DIST_DIR }}/config-*
          generate_release_notes: true
          draft: false
          # Marked prerelease because the kernel compiles and packages
          # cleanly but has never been booted on actual hardware -- CI
          # can prove an Image links, not that it comes up on a phone.
          # Flip to false once it has been flashed to a Pixel 8 and
          # verified working (boot, WiFi/BT, charging, the 10-restart
          # retry), along with moving the tag past v0.x.
          prerelease: true
