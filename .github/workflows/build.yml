name: Build Tensor G3 Kernel with KernelSU Next

on:
  push:
    branches: [main, master, 16.0.0-sultan]
    tags: ['v*']
  pull_request:
    branches: [main, master, 16.0.0-sultan]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

env:
  KERNEL_SRC_DIR: ${{ github.workspace }}/kernel_source
  DIST_DIR: ${{ github.workspace }}/dist
  OUR_REPO_DIR: ${{ github.workspace }}/our_modifications

jobs:
  build:
    name: Build Kernel (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]

    steps:
      - name: Setup Node.js 20 (for actions/checkout@v4)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout our modifications
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          path: ${{ env.OUR_REPO_DIR }}

      - name: Clone full kernel source
        run: |
          git clone --depth=1 -b 16.0.0-sultan \
            https://github.com/kerneltoast/android_kernel_google_tensynos.git \
            ${{ env.KERNEL_SRC_DIR }}

      - name: Checkout KernelSU Next
        uses: actions/checkout@v4.2.2
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: dev
          path: ${{ env.KERNEL_SRC_DIR }}/kernelsu-next
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex \
            git libelf-dev libncurses5-dev libssl-dev python3-full python3-dev \
            unzip wget zip zlib1g-dev lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install LLVM/Clang
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          sudo mv clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04 /opt/llvm
          echo "/opt/llvm/bin" >> $GITHUB_PATH
          /opt/llvm/bin/clang --version

      - name: Build kernel
        run: |
          set -e

          BUILD_DIR="/tmp/kernel_build"
          OUT_DIR="/tmp/kernel_out"

          echo "=== Setting up isolated build environment ==="
          rm -rf "${BUILD_DIR}" "${OUT_DIR}"
          mkdir -p "${BUILD_DIR}" "${OUT_DIR}"

          # Copy kernel source to isolated build directory (no .git needed)
          cp -r "${KERNEL_SRC_DIR}"/* "${BUILD_DIR}/"
          cp -r "${KERNEL_SRC_DIR}/kernelsu-next" "${BUILD_DIR}/kernelsu-next" 2>/dev/null || true

          cd "${BUILD_DIR}"

          # Clean any build artifacts that could trip the "source tree not clean" check
          rm -rf out .config .config.old include/config include/generated
          rm -rf arch/arm64/include/generated
          rm -f Module.symvers modules.builtin modules.order

          # Apply KernelSU Next Kconfig source into main Kconfig
          if ! grep -q "kernelsu-next/kernel/Kconfig" Kconfig; then
            if grep -q 'source "security/Kconfig"' Kconfig; then
              sed -i '/source "security\/Kconfig"/a source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            elif grep -q 'source "crypto/Kconfig"' Kconfig; then
              sed -i '/source "crypto\/Kconfig"/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            elif grep -q 'source "lib/Kconfig"' Kconfig; then
              sed -i '/source "lib\/Kconfig"/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            else
              echo 'source "kernelsu-next/kernel/Kconfig"' >> Kconfig
            fi
          fi

          # Apply power save exclusion Kconfig options
          if ! grep -q "BLUETOOTH_POWERSAVE_EXCLUDE" google-devices/zuma/Kconfig.ext.zuma; then
            printf '\nconfig BLUETOOTH_POWERSAVE_EXCLUDE\n  bool "Exclude Bluetooth from power saving"\n  default y\n\nconfig WIFI_POWERSAVE_EXCLUDE\n  bool "Exclude WiFi from power saving"\n  default y\n' >> google-devices/zuma/Kconfig.ext.zuma
          fi

          # Copy modified source files from our repo
          cp "${OUR_REPO_DIR}/google-modules/bluetooth/broadcom/nitrous.c" \
             google-modules/bluetooth/broadcom/nitrous.c
          cp "${OUR_REPO_DIR}/google-modules/wlan/bcm4389/Kbuild" \
             google-modules/wlan/bcm4389/Kbuild
          cp "${OUR_REPO_DIR}/google-modules/power/reset/pixel-zuma-reboot.c" \
             google-modules/power/reset/pixel-zuma-reboot.c

          # Apply build configs
          if ! grep -q "CONFIG_KSU=y" build.config.common; then
            printf '\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_EXT4_FS=y\nCONFIG_BLUETOOTH_POWERSAVE_EXCLUDE=y\nCONFIG_WIFI_POWERSAVE_EXCLUDE=y\n' >> build.config.common
          fi

          # Setup build environment
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export KCONFIG_NOTIMESTAMP=1

          echo "=== Generating frozen .config ==="

          # Generate defconfig into OUT_DIR only (never touches source tree)
          make O="${OUT_DIR}" zuma_defconfig \
            KSU=y KPROBES=y EXT4_FS=y \
            BLUETOOTH_POWERSAVE_EXCLUDE=y WIFI_POWERSAVE_EXCLUDE=y \
            DEBUG_REBOOT=y LOCALVERSION="-kernelsu-next"

          # Apply custom configs via scripts/config
          ./scripts/config --file "${OUT_DIR}/.config" \
            --enable KSU --enable KPROBES --enable EXT4_FS \
            --enable BLUETOOTH_POWERSAVE_EXCLUDE --enable WIFI_POWERSAVE_EXCLUDE \
            --enable DEBUG_REBOOT --set-str LOCALVERSION "-kernelsu-next"

          # Finalize config
          make O="${OUT_DIR}" olddefconfig
          make O="${OUT_DIR}" syncconfig

          # KEY FIX: force auto.conf/auto.conf.cmd to be NEWER than .config so the
          # build step never re-triggers syncconfig (kills the GEN/SYNC loop)
          touch "${OUT_DIR}/include/config/auto.conf"
          touch "${OUT_DIR}/include/config/auto.conf.cmd"

          # Safety: make sure no .config leaked into the source tree
          rm -f "${BUILD_DIR}/.config"
          rm -rf "${BUILD_DIR}/out"

          ls -la "${OUT_DIR}/.config"

          echo "=== Building kernel ==="

          # Single make call with O= only. No KBUILD_OUTPUT env, no KCONFIG_CONFIG.
          make O="${OUT_DIR}" -j"$(nproc)" \
            LLVM=1 LLVM_IAS=1 \
            Image dtbs modules

          echo "=== Build outputs ==="
          ls -la "${OUT_DIR}/arch/arm64/boot/Image"

          # Install modules
          make O="${OUT_DIR}" INSTALL_MOD_PATH="/tmp/modules" modules_install

          # Copy artifacts
          mkdir -p "${DIST_DIR}"
          cp "${OUT_DIR}/arch/arm64/boot/Image" "${DIST_DIR}/Image-${{ matrix.build_type }}"
          cp "${OUT_DIR}/.config" "${DIST_DIR}/config-${{ matrix.build_type }}"
          cp "${OUT_DIR}/vmlinux" "${DIST_DIR}/vmlinux-${{ matrix.build_type }}" 2>/dev/null || true
          mkdir -p "${DIST_DIR}/dtb"
          cp "${OUT_DIR}/arch/arm64/boot/dts/google/"*.dtb "${DIST_DIR}/dtb/" 2>/dev/null || true

          # Create AnyKernel3 flashable zip
          echo "=== Creating AnyKernel3 flashable zip ==="
          AK3_DIR="/tmp/anykernel3"
          rm -rf "${AK3_DIR}"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${AK3_DIR}"
          rm -f "${AK3_DIR}/Image" "${AK3_DIR}/dtb"
          rm -rf "${AK3_DIR}/modules"
          cp "${OUT_DIR}/arch/arm64/boot/Image" "${AK3_DIR}/"
          mkdir -p "${AK3_DIR}/dtb"
          cp "${OUT_DIR}/arch/arm64/boot/dts/google/"*.dtb "${AK3_DIR}/dtb/" 2>/dev/null || true
          mkdir -p "${AK3_DIR}/modules"
          if [ -d "/tmp/modules" ]; then
            find /tmp/modules -name "*.ko" -exec cp {} "${AK3_DIR}/modules/" \; 2>/dev/null || true
          fi

          cat > "${AK3_DIR}/anykernel.sh" << 'AKEOF'
          properties() {
            kernel.string=Tensor G3 KernelSU Next
            do.devicecheck=1
            do.modules=1
            do.cleanup=1
            do.cleanuponabort=1
            device.name1=zuma
            device.name2=shusky
            device.name3=husky
            device.name4=akita
            device.name5=tokay
            supported.versions=-
          }
          . tools/ak3-core.sh
          dump_boot
          write_boot
          AKEOF

          cd "${AK3_DIR}"
          zip -r9 "${DIST_DIR}/KernelSU-Next-zuma-${{ matrix.build_type }}-${GITHUB_RUN_NUMBER}.zip" . -x ".git*" -x "README.md" -x "*.zip"

          echo "=== Build completed successfully! ==="

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.build_type }}
          path: |
            ${{ env.DIST_DIR }}/*
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.DIST_DIR }}/*.zip
            ${{ env.DIST_DIR }}/Image-*
            ${{ env.DIST_DIR }}/config-*
            ${{ env.DIST_DIR }}/vmlinux-*
          generate_release_notes: true
          draft: false
          prerelease: false
