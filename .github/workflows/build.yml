name: Build Tensor G3 Kernel with KernelSU Next

on:
  push:
    branches: [main, master, 16.0.0-sultan]
    tags: ['v*']
  pull_request:
    branches: [main, master, 16.0.0-sultan]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

env:
  KERNEL_SRC_DIR: ${{ github.workspace }}/kernel_source
  DIST_DIR: ${{ github.workspace }}/dist
  OUR_REPO_DIR: ${{ github.workspace }}/our_modifications

jobs:
  build:
    name: Build Kernel (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]

    steps:
      - name: Setup Node.js 20 (for actions/checkout@v4)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout our modifications
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          path: ${{ env.OUR_REPO_DIR }}

      - name: Clone full kernel source
        run: |
          git clone --depth=1 -b 16.0.0-sultan \
            https://github.com/kerneltoast/android_kernel_google_tensynos.git \
            ${{ env.KERNEL_SRC_DIR }}

      - name: Checkout KernelSU Next
        uses: actions/checkout@v4.2.2
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: dev
          path: ${{ env.KERNEL_SRC_DIR }}/kernelsu-next
          submodules: true

      - name: Apply modifications to source
        run: |
          cd ${{ env.KERNEL_SRC_DIR }}
          
          if ! grep -q "kernelsu-next/kernel/Kconfig" Kconfig; then
            if grep -q 'source "security/Kconfig"' Kconfig; then
              sed -i '/source "security\/Kconfig"/a source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            elif grep -q 'source "crypto/Kconfig"' Kconfig; then
              sed -i '/source "crypto\/Kconfig"/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            elif grep -q 'source "lib/Kconfig"' Kconfig; then
              sed -i '/source "lib\/Kconfig"/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            else
              sed -i '/choice/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            fi
          fi
          
          if ! grep -q "BLUETOOTH_POWERSAVE_EXCLUDE" google-devices/zuma/Kconfig.ext.zuma; then
            printf '\n# KernelSU Next\nsource "$(srctree)/kernelsu-next/kernel/Kconfig"\n\nconfig BLUETOOTH_POWERSAVE_EXCLUDE\n  bool "Exclude Bluetooth from power saving"\n  default y\n  help\n    Exclude Bluetooth from power saving to work around hardware issues.\n\nconfig WIFI_POWERSAVE_EXCLUDE\n  bool "Exclude WiFi from power saving"\n  default y\n  help\n    Exclude WiFi from power saving to work around hardware issues.\n' >> google-devices/zuma/Kconfig.ext.zuma
          fi
          
          cp "${{ env.OUR_REPO_DIR }}/google-modules/bluetooth/broadcom/nitrous.c" \
             google-modules/bluetooth/broadcom/nitrous.c
          cp "${{ env.OUR_REPO_DIR }}/google-modules/wlan/bcm4389/Kbuild" \
             google-modules/wlan/bcm4389/Kbuild
          cp "${{ env.OUR_REPO_DIR }}/google-modules/power/reset/pixel-zuma-reboot.c" \
             google-modules/power/reset/pixel-zuma-reboot.c
          
          if ! grep -q "CONFIG_KSU=y" build.config.common; then
            printf '\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_EXT4_FS=y\nCONFIG_BLUETOOTH_POWERSAVE_EXCLUDE=y\nCONFIG_WIFI_POWERSAVE_EXCLUDE=y\n' >> build.config.common
          fi

      - name: Build kernel in isolated directory
        run: |
          # Create completely isolated build directory OUTSIDE the source tree
          BUILD_DIR="/tmp/kernel_build"
          OUT_DIR="/tmp/kernel_out"
          
          echo "=== Setting up isolated build environment ==="
          rm -rf "${BUILD_DIR}" "${OUT_DIR}"
          mkdir -p "${BUILD_DIR}" "${OUT_DIR}"
          
          # Copy kernel source to isolated build directory
          cp -r ${{ env.KERNEL_SRC_DIR }}/* "${BUILD_DIR}/"
          cp -r ${{ env.KERNEL_SRC_DIR }}/kernelsu-next "${BUILD_DIR}/kernelsu-next"
          
          cd "${BUILD_DIR}"
          make mrproper 2>/dev/null || true
          
          # Apply modifications to isolated build directory
          if ! grep -q "kernelsu-next/kernel/Kconfig" Kconfig; then
            if grep -q 'source "security/Kconfig"' Kconfig; then
              sed -i '/source "security\/Kconfig"/a source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            elif grep -q 'source "crypto/Kconfig"' Kconfig; then
              sed -i '/source "crypto\/Kconfig"/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            elif grep -q 'source "lib/Kconfig"' Kconfig; then
              sed -i '/source "lib\/Kconfig"/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            else
              sed -i '/choice/i source "kernelsu-next\/kernel\/Kconfig"' Kconfig
            fi
          fi
          
          if ! grep -q "BLUETOOTH_POWERSAVE_EXCLUDE" google-devices/zuma/Kconfig.ext.zuma; then
            printf '\n# KernelSU Next\nsource "$(srctree)/kernelsu-next/kernel/Kconfig"\n\nconfig BLUETOOTH_POWERSAVE_EXCLUDE\n  bool "Exclude Bluetooth from power saving"\n  default y\n  help\n    Exclude Bluetooth from power saving to work around hardware issues.\n\nconfig WIFI_POWERSAVE_EXCLUDE\n  bool "Exclude WiFi from power saving"\n  default y\n  help\n    Exclude WiFi from power saving to work around hardware issues.\n' >> google-devices/zuma/Kconfig.ext.zuma
          fi
          
          cp ${{ env.KERNEL_SRC_DIR }}/google-modules/bluetooth/broadcom/nitrous.c \
             google-modules/bluetooth/broadcom/nitrous.c
          cp ${{ env.KERNEL_SRC_DIR }}/google-modules/wlan/bcm4389/Kbuild \
             google-modules/wlan/bcm4389/Kbuild
          cp ${{ env.KERNEL_SRC_DIR }}/google-modules/power/reset/pixel-zuma-reboot.c \
             google-modules/power/reset/pixel-zuma-reboot.c
          
          if ! grep -q "CONFIG_KSU=y" build.config.common; then
            printf '\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_EXT4_FS=y\nCONFIG_BLUETOOTH_POWERSAVE_EXCLUDE=y\nCONFIG_WIFI_POWERSAVE_EXCLUDE=y\n' >> build.config.common
          fi
          
          cp ${{ env.KERNEL_SRC_DIR }}/build.config.constants build.config.constants

      - name: Build kernel (in-tree in isolated directory)
        run: |
          cd /tmp/kernel_build
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KCONFIG_NOTIMESTAMP=1
          
          # Apply our configs to build config
          echo 'CONFIG_KSU=y' >> build.config.common
          echo 'CONFIG_KPROBES=y' >> build.config.common
          echo 'CONFIG_EXT4_FS=y' >> build.config.common
          echo 'CONFIG_BLUETOOTH_POWERSAVE_EXCLUDE=y' >> build.config.common
          echo 'CONFIG_WIFI_POWERSAVE_EXCLUDE=y' >> build.config.common
          echo 'CONFIG_DEBUG_REBOOT=y' >> build.config.common
          echo 'CONFIG_LOCALVERSION="-kernelsu-next"' >> build.config.common
          
          # Copy build config constants
          cp ${{ env.KERNEL_SRC_DIR }}/build.config.constants build.config.constants
          
          # Apply our configs to build config
          echo 'CONFIG_KSU=y' >> build.config.common
          echo 'CONFIG_KPROBES=y' >> build.config.common
          echo 'CONFIG_EXT4_FS=y' >> build.config.common
          echo 'CONFIG_BLUETOOTH_POWERSAVE_EXCLUDE=y' >> build.config.common
          echo 'CONFIG_WIFI_POWERSAVE_EXCLUDE=y' >> build.config.common
          echo 'CONFIG_DEBUG_REBOOT=y' >> build.config.common
          echo 'CONFIG_LOCALVERSION="-kernelsu-next"' >> build.config.common
          
          # Copy build config constants
          cp ${{ env.KERNEL_SRC_DIR }}/build.config.constants build.config.constants
          
          # Clean and configure - NO O=, build in-tree in isolated directory
          make mrproper 2>/dev/null || true
          make zuma_defconfig \
            KSU=y KPROBES=y EXT4_FS=y \
            BLUETOOTH_POWERSAVE_EXCLUDE=y WIFI_POWERSAVE_EXCLUDE=y \
            DEBUG_REBOOT=y LOCALVERSION="-kernelsu-next"
          
          # Apply our custom configs
          ./scripts/config --file .config \
            --enable KSU --enable KPROBES --enable EXT4_FS \
            --enable BLUETOOTH_POWERSAVE_EXCLUDE --enable WIFI_POWERSAVE_EXCLUDE \
            --enable DEBUG_REBOOT --set-str LOCALVERSION "-kernelsu-next"
          
          make olddefconfig
          make syncconfig
          make prepare
          
          # Build everything in ONE call
          make -j$(nproc) \
            LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
            KCONFIG_NOTIMESTAMP=1 \
            Image dtbs modules
          
          # Verify outputs
          ls -la arch/arm64/boot/Image
          ls -la .config

      - name: Install modules
        run: |
          cd /tmp/kernel_build
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCONFIG_NOTIMESTAMP=1
          
          make INSTALL_MOD_PATH=${{ env.DIST_DIR }}/modules modules_install
          find ${{ env.DIST_DIR }}/modules -name "*.ko" -exec aarch64-linux-gnu-strip --strip-unneeded {} \; 2>/dev/null || true

      - name: Prepare artifacts
        run: |
          mkdir -p ${{ env.DIST_DIR }}
          
          cp /tmp/kernel_build/arch/arm64/boot/Image ${{ env.DIST_DIR }}/Image-${{ matrix.build_type }}
          cp /tmp/kernel_build/.config ${{ env.DIST_DIR }}/config-${{ matrix.build_type }}
          cp /tmp/kernel_build/vmlinux ${{ env.DIST_DIR }}/vmlinux-${{ matrix.build_type }} 2>/dev/null || true
          mkdir -p ${{ env.DIST_DIR }}/dtb
          cp /tmp/kernel_build/arch/arm64/boot/dts/google/*.dtb ${{ env.DIST_DIR }}/dtb/ 2>/dev/null || true
          
          if [ -d "modules" ]; then
            mkdir -p ${{ env.DIST_DIR }}/modules-${{ matrix.build_type }}
            cp -r modules/* ${{ env.DIST_DIR }}/modules-${{ matrix.build_type }}/ 2>/dev/null || true
          fi

      - name: Create AnyKernel3 flashable zip
        run: |
          cd /tmp/kernel_build
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          rm -f anykernel3/Image anykernel3/dtb
          rm -rf anykernel3/modules
          cp arch/arm64/boot/Image anykernel3/
          mkdir -p anykernel3/dtb
          cp arch/arm64/boot/dts/google/*.dtb anykernel3/dtb/ 2>/dev/null || true
          mkdir -p anykernel3/modules
          if [ -d "modules" ]; then
            cp -r modules/lib/modules/* anykernel3/modules/ 2>/dev/null || true
          fi
          printf 'properties() {\n  kernel.string=Tensor G3 KernelSU Next\n  do.devicecheck=1\n  do.modules=1\n  do.cleanup=1\n  do.cleanuponabort=1\n  device.name1=zuma\n  device.name2=shusky\n  device.name3=husky\n  device.name4=akita\n  device.name5=tokay\n  supported.versions=14\n}\n. tools/ak3-core.sh\ndump_boot\nwrite_boot\nif [ "$do.modules" == 1 ]; then\n  for module in modules/*; do\n    if [ -f "$module" ]; then\n      ui_print "Installing $(basename $module)..."\n      cp -f "$module" "$ramdisk/lib/modules/"\n    fi\n  done\nfi\n' > anykernel3/anykernel.sh
          cd anykernel3
          zip -r9 ${{ env.DIST_DIR }}/KernelSU-Next-zuma-${{ matrix.build_type }}-${{ github.run_number }}.zip . -x ".git*" -x "README.md" -x "*.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.build_type }}
          path: |
            ${{ env.DIST_DIR }}/*
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.DIST_DIR }}/*.zip
            ${{ env.DIST_DIR }}/Image-*
            ${{ env.DIST_DIR }}/config-*
            ${{ env.DIST_DIR }}/vmlinux-*
          generate_release_notes: true
          draft: false
          prerelease: false